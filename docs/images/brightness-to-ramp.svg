<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 470" width="1180" height="470"
     font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>The 256-entry brightness table, and the two answers it gives</title>
  <desc>A bar of all 256 brightness values divided into ten bands, each band
        showing the ramp character and the ramp position it maps to, with the
        boundary values marked. Below, the terminal takes the characters and the
        panel takes the positions, both from the same table.</desc>
  <defs>
    <style>
      .card  { fill: #ffffff; stroke: #e5e7eb; }
      .title { font-size: 15px; font-weight: 700; fill: #111827; }
      .step  { font-size: 13px; font-weight: 700; fill: #1d4ed8; }
      .cap   { font-size: 11.5px; fill: #374151; }
      .dim   { font-size: 11px; fill: #6b7280; }
      .mono  { font-family: ui-monospace, Menlo, Consolas, monospace; }
      .tick  { stroke: #cbd5e1; stroke-width: 1; }
    </style>
  </defs>
  <rect class="card" x="0.5" y="0.5" width="1179" height="469" rx="8"/>
  <text class="title" x="28" y="34">One table, two answers</text>
  <text class="dim"   x="28" y="53">Brightness picks a position on the ramp. The terminal asks for the character there; the panel asks for the position itself.</text>
<text class="step" x="40" y="92">the table: 256 entries, built once per ramp, invert or colour-levels change</text>
<rect x="40.0" y="106" width="111.7" height="44" fill="rgb(12,12,12)" stroke="#94a3b8" stroke-width="0.7"/>
<rect x="84.9" y="168" width="22" height="22" fill="none" stroke="#cbd5e1" stroke-dasharray="3 2"/>
<text class="dim" x="95.9" y="205" text-anchor="middle">space</text>
<text class="mono" x="95.9" y="224" font-size="12" text-anchor="middle" fill="#6b7280">0</text>
<rect x="151.7" y="106" width="111.7" height="44" fill="rgb(38,38,38)" stroke="#94a3b8" stroke-width="0.7"/>
<text class="mono" x="207.6" y="188" font-size="22" text-anchor="middle" fill="#1e3a8a">.</text>
<text class="mono" x="207.6" y="224" font-size="12" text-anchor="middle" fill="#6b7280">1</text>
<rect x="263.4" y="106" width="107.4" height="44" fill="rgb(64,64,64)" stroke="#94a3b8" stroke-width="0.7"/>
<text class="mono" x="317.1" y="188" font-size="22" text-anchor="middle" fill="#1e3a8a">:</text>
<text class="mono" x="317.1" y="224" font-size="12" text-anchor="middle" fill="#6b7280">2</text>
<rect x="370.9" y="106" width="111.7" height="44" fill="rgb(89,89,89)" stroke="#94a3b8" stroke-width="0.7"/>
<text class="mono" x="426.7" y="188" font-size="22" text-anchor="middle" fill="#1e3a8a">-</text>
<text class="mono" x="426.7" y="224" font-size="12" text-anchor="middle" fill="#6b7280">3</text>
<rect x="482.6" y="106" width="107.4" height="44" fill="rgb(115,115,115)" stroke="#94a3b8" stroke-width="0.7"/>
<text class="mono" x="536.3" y="188" font-size="22" text-anchor="middle" fill="#1e3a8a">=</text>
<text class="mono" x="536.3" y="224" font-size="12" text-anchor="middle" fill="#6b7280">4</text>
<rect x="590.0" y="106" width="111.7" height="44" fill="rgb(140,140,140)" stroke="#94a3b8" stroke-width="0.7"/>
<text class="mono" x="645.9" y="188" font-size="22" text-anchor="middle" fill="#1e3a8a">+</text>
<text class="mono" x="645.9" y="224" font-size="12" text-anchor="middle" fill="#6b7280">5</text>
<rect x="701.7" y="106" width="111.7" height="44" fill="rgb(166,166,166)" stroke="#94a3b8" stroke-width="0.7"/>
<text class="mono" x="757.6" y="188" font-size="22" text-anchor="middle" fill="#1e3a8a">*</text>
<text class="mono" x="757.6" y="224" font-size="12" text-anchor="middle" fill="#6b7280">6</text>
<rect x="813.4" y="106" width="107.4" height="44" fill="rgb(192,192,192)" stroke="#94a3b8" stroke-width="0.7"/>
<text class="mono" x="867.1" y="188" font-size="22" text-anchor="middle" fill="#1e3a8a">#</text>
<text class="mono" x="867.1" y="224" font-size="12" text-anchor="middle" fill="#6b7280">7</text>
<rect x="920.9" y="106" width="111.7" height="44" fill="rgb(217,217,217)" stroke="#94a3b8" stroke-width="0.7"/>
<text class="mono" x="976.7" y="188" font-size="22" text-anchor="middle" fill="#1e3a8a">%</text>
<text class="mono" x="976.7" y="224" font-size="12" text-anchor="middle" fill="#6b7280">8</text>
<rect x="1032.6" y="106" width="107.4" height="44" fill="rgb(243,243,243)" stroke="#94a3b8" stroke-width="0.7"/>
<text class="mono" x="1086.3" y="188" font-size="22" text-anchor="middle" fill="#1e3a8a">@</text>
<text class="mono" x="1086.3" y="224" font-size="12" text-anchor="middle" fill="#6b7280">9</text>
<line class="tick" x1="40.0" y1="150" x2="40.0" y2="158"/>
<text class="dim" x="40.0" y="248" text-anchor="middle">0</text>
<line class="tick" x1="151.7" y1="150" x2="151.7" y2="158"/>
<text class="dim" x="151.7" y="248" text-anchor="middle">26</text>
<line class="tick" x1="263.4" y1="150" x2="263.4" y2="158"/>
<text class="dim" x="263.4" y="248" text-anchor="middle">52</text>
<line class="tick" x1="370.9" y1="150" x2="370.9" y2="158"/>
<text class="dim" x="370.9" y="248" text-anchor="middle">77</text>
<line class="tick" x1="482.6" y1="150" x2="482.6" y2="158"/>
<text class="dim" x="482.6" y="248" text-anchor="middle">103</text>
<line class="tick" x1="590.0" y1="150" x2="590.0" y2="158"/>
<text class="dim" x="590.0" y="248" text-anchor="middle">128</text>
<line class="tick" x1="701.7" y1="150" x2="701.7" y2="158"/>
<text class="dim" x="701.7" y="248" text-anchor="middle">154</text>
<line class="tick" x1="813.4" y1="150" x2="813.4" y2="158"/>
<text class="dim" x="813.4" y="248" text-anchor="middle">180</text>
<line class="tick" x1="920.9" y1="150" x2="920.9" y2="158"/>
<text class="dim" x="920.9" y="248" text-anchor="middle">205</text>
<line class="tick" x1="1032.6" y1="150" x2="1032.6" y2="158"/>
<text class="dim" x="1032.6" y="248" text-anchor="middle">231</text>
<text class="dim" x="1140.0" y="248" text-anchor="end">255</text>
<text class="dim" x="40" y="272">levels * 10 // 256, clamped - so the boundaries land where the arithmetic puts them, and the darkest cells are left empty</text>
<line x1="28" y1="292" x2="1152" y2="292" stroke="#e5e7eb"/>
<text class="step" x="40" y="320">the terminal asks for the character</text>
<text class="mono" x="40" y="352" font-size="17" fill="#1e3a8a">@%#*+=-.  %#*+=-.   #*+=-.</text>
<text class="cap" x="40" y="380">one string per row, from a single tobytes() and decode()</text>
<text class="dim" x="40" y="400">a Python loop over cells would be 26,700 interpreter round trips a frame at 267 x 100,</text>
<text class="dim" x="40" y="415">which is more than everything else in the pipeline put together</text>
<line x1="596" y1="304" x2="596" y2="424" stroke="#e5e7eb"/>
<text class="step" x="628" y="320">the panel asks for the position</text>
<text class="mono" x="628" y="352" font-size="17" fill="#1e3a8a">9 7 7 4 2 0 0 1 8 9 6 3 1 0</text>
<text class="cap" x="628" y="380">an index into the glyph atlas, which holds tiles and not text</text>
<text class="dim" x="628" y="400">both answers come out of one build, so a brightness that is # on the terminal</text>
<text class="dim" x="628" y="415">is the # tile on the panel - including after an invert, by construction</text>
<line x1="28" y1="436" x2="1152" y2="436" stroke="#e5e7eb"/>
<text class="cap" x="40" y="458">invert reverses the characters and leaves the position table untouched:</text>
<text class="mono" x="512" y="458" font-size="13" fill="#1e3a8a">@%#*+=-.  becomes  .-=+*#%@</text>
<text class="dim" x="792" y="458">while 0 to 9 still means darkest to brightest</text>
</svg>
