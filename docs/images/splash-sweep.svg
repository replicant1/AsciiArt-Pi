<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 470" width="1180" height="470"
     font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>The start-up screen, and the bar that shows it is alive</title>
  <desc>Three successive drawings of the start-up screen, its message changing
        from starting camera to waiting for first frame to ready, with a comet
        of nine characters advancing three cells along a twenty-eight cell bar
        each time.</desc>
  <defs>
    <style>
      .card  { fill: #ffffff; stroke: #e5e7eb; }
      .title { font-size: 15px; font-weight: 700; fill: #111827; }
      .step  { font-size: 13px; font-weight: 700; fill: #1d4ed8; }
      .cap   { font-size: 11.5px; fill: #374151; }
      .dim   { font-size: 11px; fill: #6b7280; }
      .mono  { font-family: ui-monospace, Menlo, Consolas, monospace; }
      .panel { fill: #0b0b0c; stroke: #334155; stroke-width: 1.4; }
    </style>
  </defs>
  <rect class="card" x="0.5" y="0.5" width="1179" height="469" rx="8"/>
  <text class="title" x="28" y="34">Twenty seconds of saying so</text>
  <text class="dim"   x="28" y="53">libcamera takes about twenty seconds to hand over a first frame. Unlit glass for twenty seconds is what broken hardware looks like.</text>
<rect class="panel" x="40" y="104" width="264" height="198"/>
<text class="mono" x="172" y="150" font-size="15" text-anchor="middle" fill="#8ab4f0">ASCII ART CAMERA</text>
<text class="mono" x="172" y="176" font-size="11" text-anchor="middle" fill="#64748b">v1.0  64 x 24</text>
<text class="mono" x="172" y="222" font-size="12" text-anchor="middle" fill="#e2e8f0">starting camera</text>
<rect x="58" y="246" width="228" height="26" fill="#111827" stroke="#334155" stroke-width="0.7"/>
<text class="mono" x="64" y="265" font-size="13" fill="#ffb703" xml:space="preserve">.:-=+*#%@                   </text>
<text class="dim" x="40" y="322">the panel is lit before the six second import</text>
<line x1="312" y1="200" x2="336" y2="200" stroke="#9ca3af" stroke-width="1.5"/>
<text class="dim" x="324" y="192" text-anchor="middle">0.1 s</text>
<rect class="panel" x="340" y="104" width="264" height="198"/>
<text class="mono" x="472" y="150" font-size="15" text-anchor="middle" fill="#8ab4f0">ASCII ART CAMERA</text>
<text class="mono" x="472" y="176" font-size="11" text-anchor="middle" fill="#64748b">v1.0  64 x 24</text>
<text class="mono" x="472" y="222" font-size="12" text-anchor="middle" fill="#e2e8f0">waiting for first frame</text>
<rect x="358" y="246" width="228" height="26" fill="#111827" stroke="#334155" stroke-width="0.7"/>
<text class="mono" x="364" y="265" font-size="13" fill="#ffb703" xml:space="preserve">   .:-=+*#%@                </text>
<text class="dim" x="340" y="322">one tick later: the comet has moved three cells</text>
<line x1="612" y1="200" x2="636" y2="200" stroke="#9ca3af" stroke-width="1.5"/>
<text class="dim" x="624" y="192" text-anchor="middle">0.1 s</text>
<rect class="panel" x="640" y="104" width="264" height="198"/>
<text class="mono" x="772" y="150" font-size="15" text-anchor="middle" fill="#8ab4f0">ASCII ART CAMERA</text>
<text class="mono" x="772" y="176" font-size="11" text-anchor="middle" fill="#64748b">v1.0  64 x 24</text>
<text class="mono" x="772" y="222" font-size="12" text-anchor="middle" fill="#e2e8f0">ready</text>
<rect x="658" y="246" width="228" height="26" fill="#111827" stroke="#334155" stroke-width="0.7"/>
<text class="mono" x="664" y="265" font-size="13" fill="#ffb703" xml:space="preserve">      .:-=+*#%@             </text>
<text class="dim" x="640" y="322">frames are arriving, so the old message stopped being true</text>
<line x1="28" y1="346" x2="1152" y2="346" stroke="#e5e7eb"/>
<text class="step" x="40" y="374">the bar</text>
<text class="cap" x="40" y="396">28 cells, a comet 9 long, advancing 3 a tick.</text>
<text class="dim" x="40" y="414">Its own ramp, deliberately not the app's: that one</text>
<text class="dim" x="40" y="429">reverses under invert, which would turn the comet</text>
<text class="dim" x="40" y="444">into a gap travelling through a bright bar.</text>
<text class="step" x="420" y="374">the tick</text>
<text class="cap" x="420" y="396">0.1 s while the screen is up, 0.2 s afterwards.</text>
<text class="dim" x="420" y="414">The tick is the animation's frame rate as well as a</text>
<text class="dim" x="420" y="429">poll interval - at the idle rate one sweep would take</text>
<text class="dim" x="420" y="444">over seven seconds, longer than the screen is ever up.</text>
<text class="step" x="810" y="374">and the honesty</text>
<text class="cap" x="810" y="396">A liveness indicator, not a progress bar.</text>
<text class="dim" x="810" y="414">Nothing here knows how long the camera will take, and</text>
<text class="dim" x="810" y="429">a bar that implied it did would be a lie. The message is</text>
<text class="dim" x="810" y="444">replaced as start-up moves on, for the same reason.</text>
</svg>
