<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 560" width="1180" height="560"
     font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>What ImageProcessor does to one frame</title>
  <desc>A camera frame of 320 by 240 pixels is rotated, cropped, resized and
        levelled until it is a grid of character cells. Below, the same window
        drawn twice: in fill mode the grid is the whole window and the frame is
        cropped to suit; in fit mode the grid shrinks to the frame's shape and
        the rest of the window stays blank.</desc>
  <defs>
    <pattern id="dropped" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="#fee2e2"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#f87171" stroke-width="1.6"/>
    </pattern>
    <pattern id="blank" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#f3f4f6"/>
      <circle cx="3" cy="3" r="0.9" fill="#cbd5e1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <clipPath id="fillwin"><rect x="60" y="366" width="240" height="90"/></clipPath>
    <style>
      .card   { fill: #ffffff; stroke: #e5e7eb; }
      .title  { font-size: 15px; font-weight: 700; fill: #111827; }
      .step   { font-size: 13px; font-weight: 700; fill: #1d4ed8; }
      .cap    { font-size: 11.5px; fill: #374151; }
      .dim    { font-size: 11px; fill: #6b7280; }
      .frame  { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 1.6; }
      .ghost  { fill: none; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 4 3; }
      .keep   { fill: #eff6ff; stroke: #16a34a; stroke-width: 2; }
      .glyph  { font-family: ui-monospace, Menlo, Consolas, monospace; fill: #1d4ed8; }
      .cell   { stroke: #93c5fd; stroke-width: 0.8; fill: none; }
    </style>
  </defs>
  <rect class="card" x="0.5" y="0.5" width="1179" height="559" rx="8"/>
  <text class="title" x="28" y="34">One frame, from the sensor to the character grid</text>
  <text class="dim"   x="28" y="53">Left to right, the same picture at every stage. Nothing here crosses a thread.</text>
<text class="step" x="40" y="92">the camera frame</text>
<rect class="frame" x="40" y="104" width="160" height="120" rx="3"/>
<text class="glyph" x="120" y="188" font-size="72" text-anchor="middle">F</text>
<text class="cap" x="40" y="244">320 x 240, one byte a pixel</text>
<text class="dim" x="40" y="260">76,800 of them</text>
<line x1="212" y1="164" x2="252" y2="164" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="step" x="264" y="92">rotate</text>
<rect class="frame" x="264" y="104" width="160" height="120" rx="3"/>
<text class="glyph" x="344" y="188" font-size="72" text-anchor="middle">F</text>
<text class="cap" x="264" y="244">as mounted, no turn and no flip</text>
<rect class="ghost" x="264" y="256" width="40" height="30" rx="2"/>
<text class="glyph" x="284" y="279" font-size="17" text-anchor="middle" fill="#9ca3af">F</text>
<line x1="308" y1="271" x2="322" y2="271" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect class="ghost" x="326" y="251" width="30" height="40" rx="2"/>
<text class="glyph" x="341" y="277" font-size="17" text-anchor="middle" fill="#9ca3af" transform="rotate(90 341 271)">F</text>
<text class="dim" x="364" y="268">a quarter turn</text>
<text class="dim" x="364" y="283">transposes: 240 x 320</text>
<line x1="436" y1="164" x2="476" y2="164" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="step" x="488" y="92">crop, in fill mode only</text>
<rect x="488" y="104" width="160" height="120" rx="3" fill="url(#dropped)" stroke="#9ca3af" stroke-width="1"/>
<rect class="keep" x="488" y="124" width="160" height="80"/>
<text class="glyph" x="568" y="180" font-size="52" text-anchor="middle">F</text>
<text x="568" y="118" font-size="9.5" text-anchor="middle" fill="#b91c1c">cut away, 40 rows</text>
<text x="568" y="218" font-size="9.5" text-anchor="middle" fill="#b91c1c">cut away, 40 rows</text>
<text class="cap" x="488" y="244">the middle is kept, so the picture</text>
<text class="cap" x="488" y="260">can cover every cell of the grid</text>
<text class="dim" x="488" y="276">in fit mode this stage does nothing</text>
<text class="dim" x="488" y="291">at all - see below</text>
<line x1="660" y1="164" x2="700" y2="164" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="step" x="712" y="92">resize, by area averaging</text>
<rect class="frame" x="712" y="134" width="160" height="60" rx="0"/>
<g class="cell"><path d="M732 134 V194 M752 134 V194 M772 134 V194 M792 134 V194 M812 134 V194 M832 134 V194 M852 134 V194"/><path d="M712 149 H872 M712 164 H872 M712 179 H872"/></g>
<rect x="752" y="149" width="20" height="15" fill="#1d4ed8" opacity="0.75"/>
<rect x="772" y="149" width="20" height="15" fill="#1d4ed8" opacity="0.45"/>
<rect x="752" y="164" width="20" height="15" fill="#1d4ed8" opacity="0.30"/>
<text class="cap" x="712" y="244">every cell becomes the mean of</text>
<text class="cap" x="712" y="260">the pixels it covers</text>
<text class="dim" x="712" y="276">80 x 30 here: 2,400 values, and</text>
<text class="dim" x="712" y="291">everything downstream is this size</text>
<line x1="884" y1="164" x2="924" y2="164" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="step" x="936" y="92">levels, then the grid</text>
<rect class="frame" x="936" y="134" width="160" height="60" rx="0"/>
<text class="glyph" x="944" y="152" font-size="13">@ % # * + = - . &#160;</text>
<text class="glyph" x="944" y="169" font-size="13">% # * + = - . &#160; &#160;</text>
<text class="glyph" x="944" y="186" font-size="13"># * + = - . &#160; &#160; &#160;</text>
<text class="cap" x="936" y="244">the 2nd to 98th percentile of this</text>
<text class="cap" x="936" y="260">frame stretched to 0-255</text>
<text class="dim" x="936" y="276">2,400 comparisons, not 76,800,</text>
<text class="dim" x="936" y="291">because it runs after the resize</text>
<line x1="28" y1="322" x2="1152" y2="322" stroke="#e5e7eb"/>
<text class="step" x="40" y="350">what the crop is for: one window, drawn both ways</text>
<rect x="60" y="366" width="240" height="90" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
<g clip-path="url(#fillwin)"><text class="glyph" x="180" y="470" font-size="150" text-anchor="middle" opacity="0.85">F</text></g>
<text class="cap" x="60" y="482" fill="#16a34a">fill: the grid is the whole window</text>
<text class="dim" x="60" y="500">267 x 50 cells, every one of them picture -</text>
<text class="dim" x="60" y="515">and the frame gave up 80 of its 240 rows</text>
<text class="dim" x="60" y="530">to make that possible. The F is cut off.</text>
<rect x="360" y="366" width="240" height="90" fill="url(#blank)" stroke="#9ca3af" stroke-width="1"/>
<rect x="420" y="366" width="120" height="90" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
<text class="glyph" x="480" y="437" font-size="74" text-anchor="middle">F</text>
<text x="390" y="416" font-size="9.5" text-anchor="middle" fill="#6b7280">blank</text>
<text x="570" y="416" font-size="9.5" text-anchor="middle" fill="#6b7280">blank</text>
<text class="cap" x="360" y="482" fill="#1d4ed8">fit: the grid shrinks to the frame's shape</text>
<text class="dim" x="360" y="500">133 x 50 inside the same 267 x 50 window, so</text>
<text class="dim" x="360" y="515">6,700 cells stay blank at the sides - nothing is</text>
<text class="dim" x="360" y="530">cut, and the whole F survives.</text>
<line x1="680" y1="336" x2="680" y2="540" stroke="#e5e7eb"/>
<text class="step" x="712" y="350">to_grid, shared by every plane</text>
<text class="cap" x="712" y="376">The two chroma planes - 160 x 120 each - take exactly the rotate, the</text>
<text class="cap" x="712" y="392">crop and the resize above. Any difference between the planes would show</text>
<text class="cap" x="712" y="408">as colour fringing along every edge, so they go through one method.</text>
<text class="dim" x="712" y="432">They skip the levels stretch, which is the luma path only, and end as one</text>
<text class="dim" x="712" y="447">RGB triple per cell - in a live scheme, and in no other.</text>
<text class="dim" x="712" y="478">The grid size itself is settled before any of this: 64 x 24 on the SPI panel,</text>
<text class="dim" x="712" y="493">which always fills, and whatever the window holds on the HDMI terminal.</text>
</svg>
