<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 470" width="1180" height="470"
     font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>Where a character cell's colour comes from</title>
  <desc>A full-resolution luma plane and two quarter-resolution chroma planes go
        through the same reduction to a grid of cells. One cell's Y, U and V
        become an RGB triple, which the panel takes as it is and the terminal
        snaps to the nearest entry of its fixed palette.</desc>
  <defs>
    <linearGradient id="grey" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <style>
      .card  { fill: #ffffff; stroke: #e5e7eb; }
      .title { font-size: 15px; font-weight: 700; fill: #111827; }
      .step  { font-size: 13px; font-weight: 700; fill: #1d4ed8; }
      .cap   { font-size: 11.5px; fill: #374151; }
      .dim   { font-size: 11px; fill: #6b7280; }
      .mono  { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11.5px; }
      .pl    { stroke: #1d4ed8; stroke-width: 1.4; }
      .cellr { fill: #eff6ff; stroke: #93c5fd; stroke-width: 0.7; }
    </style>
  </defs>
  <rect class="card" x="0.5" y="0.5" width="1179" height="469" rx="8"/>
  <text class="title" x="28" y="34">One cell's colour, and where it is cheap to work out</text>
  <text class="dim"   x="28" y="53">The conversion runs after the downscale, so it is arithmetic on cells rather than on pixels.</text>
<text class="step" x="40" y="92">three planes, two resolutions</text>
<rect class="pl" x="40" y="104" width="150" height="112" fill="url(#grey)"/>
<text class="dim" x="40" y="232">Y, 320 x 240</text>
<rect class="pl" x="40" y="246" width="74" height="56" fill="#bfdbfe"/>
<rect class="pl" x="122" y="246" width="74" height="56" fill="#93c5fd"/>
<text class="mono" x="77" y="280" text-anchor="middle" fill="#1e3a8a">U</text>
<text class="mono" x="159" y="280" text-anchor="middle" fill="#1e3a8a">V</text>
<text class="dim" x="40" y="320">160 x 120 each: a quarter of the samples,</text>
<text class="dim" x="40" y="335">which is what makes colour affordable</text>
<line x1="212" y1="175" x2="248" y2="175" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="step" x="264" y="92">to_grid, the same path for all three</text>
<rect class="cellr" x="264" y="104" width="24" height="18"/>
