<rect x="384" y="140" width="24" height="18" fill="#1d4ed8" opacity="0.35" stroke="#1d4ed8"/>
<text class="cap" x="264" y="256">the same rotate, the same crop and the same resize</text>
<text class="cap" x="264" y="272">for every plane - a difference between them would</text>
<text class="cap" x="264" y="288">show as colour fringing along every edge</text>
<text class="dim" x="264" y="312">at 133 x 50 that is about 6,650 cells to convert,</text>
<text class="dim" x="264" y="327">where the frame itself has 76,800 pixels</text>
<path d="M408 158 L470 200 L536 200" fill="none" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text class="step" x="620" y="92">one cell of it</text>
<rect class="pl" x="620" y="104" width="110" height="110" fill="#eff6ff"/>
<text class="mono" x="675" y="140" text-anchor="middle" fill="#1e3a8a">Y = 120</text>
<text class="mono" x="675" y="172" text-anchor="middle" fill="#1e3a8a">U =  90</text>
<text class="mono" x="675" y="204" text-anchor="middle" fill="#1e3a8a">V = 200</text>
<text class="cap" x="620" y="240">Y is the luma grid that already chose this</text>
<text class="cap" x="620" y="256">cell's character, handed back in rather than</text>
<text class="cap" x="620" y="272">recomputed - so the glyph and the colour it</text>
<text class="cap" x="620" y="288">is drawn in cannot disagree</text>
<text class="dim" x="620" y="312">the chroma is read straight off the frame the</text>
<text class="dim" x="620" y="327">capture already copied, so nothing is fetched</text>
<line x1="28" y1="356" x2="1152" y2="356" stroke="#e5e7eb"/>
<text class="step" x="40" y="384">the arithmetic, per cell</text>
<text class="mono" x="40" y="408">R = Y + 1.402 (V-128)</text>
<text class="mono" x="40" y="428">G = Y - 0.344 (U-128) - 0.714 (V-128)</text>
<text class="mono" x="40" y="448">B = Y + 1.772 (U-128)</text>
<text class="mono" x="330" y="384" fill="#111827">= 220, 81, 52</text>
<rect x="330" y="396" width="86" height="52" fill="rgb(220,81,52)" stroke="#9ca3af"/>
<line x1="450" y1="366" x2="450" y2="456" stroke="#e5e7eb"/>
<text class="step" x="482" y="384">then the two displays part company</text>
<rect x="482" y="396" width="70" height="24" fill="rgb(220,81,52)" stroke="#9ca3af"/>
<text class="cap" x="562" y="413">the panel takes the RGB as computed</text>
<rect x="482" y="428" width="70" height="24" fill="rgb(215,95,95)" stroke="#9ca3af"/>
<text class="cap" x="562" y="445">the terminal takes xterm 167, its nearest</text>
<line x1="850" y1="366" x2="850" y2="456" stroke="#e5e7eb"/>
<text class="dim" x="882" y="384">The terminal has a 6 x 6 x 6 cube at palette entries 16 to</text>
<text class="dim" x="882" y="399">231 and nothing between its steps, so every colour it is</text>
<text class="dim" x="882" y="414">given lands on one of 216.</text>
<text class="dim" x="882" y="436">Quantising is therefore free there, while the panel, which</text>
<text class="dim" x="882" y="451">has no such limit, has to posterise the RGB itself.</text>
</svg>
