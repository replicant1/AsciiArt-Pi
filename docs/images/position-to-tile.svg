<text class="mono" x="509" y="174" font-size="12" text-anchor="middle" fill="#6b7280">4</text>
<rect class="tile" x="530" y="116" width="34" height="42" rx="2"/>
<text class="mono" x="547" y="146" font-size="19" text-anchor="middle" fill="#1e3a8a">+</text>
<text class="mono" x="547" y="174" font-size="12" text-anchor="middle" fill="#6b7280">5</text>
<rect class="tile" x="568" y="116" width="34" height="42" rx="2" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.8"/>
<text class="mono" x="585" y="146" font-size="19" text-anchor="middle" fill="#1e3a8a">*</text>
<text class="mono" x="585" y="174" font-size="12" text-anchor="middle" fill="#6b7280">6</text>
<rect class="tile" x="606" y="116" width="34" height="42" rx="2"/>
<text class="mono" x="623" y="146" font-size="19" text-anchor="middle" fill="#1e3a8a">#</text>
<text class="mono" x="623" y="174" font-size="12" text-anchor="middle" fill="#6b7280">7</text>
<rect class="tile" x="644" y="116" width="34" height="42" rx="2"/>
<text class="mono" x="661" y="146" font-size="19" text-anchor="middle" fill="#1e3a8a">%</text>
<text class="mono" x="661" y="174" font-size="12" text-anchor="middle" fill="#6b7280">8</text>
<rect class="tile" x="682" y="116" width="34" height="42" rx="2" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.8"/>
<text class="mono" x="699" y="146" font-size="19" text-anchor="middle" fill="#1e3a8a">@</text>
<text class="mono" x="699" y="174" font-size="12" text-anchor="middle" fill="#6b7280">9</text>
<text class="cap" x="340" y="220">every character of the ramp, drawn once into a</text>
<text class="cap" x="340" y="236">fixed-size tile - ten tiles, not a font</text>
<text class="dim" x="340" y="258">rebuilt when the ramp, the invert or the font size</text>
<text class="dim" x="340" y="273">changes, and never once per frame</text>
<text class="step" x="760" y="104">the picture they assemble</text>
<rect x="754" y="110" width="364" height="114" fill="#0b0b0c" stroke="#334155"/>
<rect x="760" y="116" width="44" height="34" fill="#f59e0b" opacity="0.28"/>
<text class="mono" x="782.0" y="141" font-size="22" text-anchor="middle" fill="#8ab4f0">@</text>
<text class="mono" x="826.0" y="141" font-size="22" text-anchor="middle" fill="#8ab4f0">#</text>
<text class="mono" x="870.0" y="141" font-size="22" text-anchor="middle" fill="#8ab4f0">#</text>
