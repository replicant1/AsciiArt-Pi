<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 566" width="1180" height="566"
     font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>What the panel does with a ramp position</title>
  <desc>A grid of ramp positions, the glyph atlas holding one pre-drawn tile per
        ramp character, and the picture those positions assemble, with three
        cells highlighted in amber across all three. Beneath, those three cells
        are followed one at a time: the position, an arrow to the tile it
        selects, and an arrow to where that tile lands in the picture.</desc>
  <defs>
    <marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
    <style>
      .card  { fill: #ffffff; stroke: #e5e7eb; }
      .title { font-size: 15px; font-weight: 700; fill: #111827; }
      .step  { font-size: 13px; font-weight: 700; fill: #1d4ed8; }
      .cap   { font-size: 11.5px; fill: #374151; }
      .dim   { font-size: 11px; fill: #6b7280; }
      .mono  { font-family: ui-monospace, Menlo, Consolas, monospace; }
      .idx   { fill: #f8fafc; stroke: #cbd5e1; }
      .tile  { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 1.2; }
    </style>
  </defs>
  <rect class="card" x="0.5" y="0.5" width="1179" height="565" rx="8"/>
  <text class="title" x="28" y="34">What a position buys: one tile, copied</text>
  <text class="dim"   x="28" y="53">The terminal takes the character. The panel takes the number, and spends it here.</text>
<text class="step" x="40" y="104">the positions, one per cell</text>
<rect class="idx" x="40" y="116" width="32" height="26" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.6"/>
<text class="mono" x="56.0" y="133" font-size="12" text-anchor="middle" fill="#334155">9</text>
<rect class="idx" x="72" y="116" width="32" height="26"/>
