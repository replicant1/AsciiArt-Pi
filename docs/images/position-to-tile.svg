<text class="mono" x="782.0" y="175" font-size="22" text-anchor="middle" fill="#8ab4f0">%</text>
<text class="mono" x="826.0" y="175" font-size="22" text-anchor="middle" fill="#8ab4f0">@</text>
<rect x="848" y="150" width="44" height="34" fill="#f59e0b" opacity="0.28"/>
<text class="mono" x="870.0" y="175" font-size="22" text-anchor="middle" fill="#8ab4f0">*</text>
<text class="mono" x="914.0" y="175" font-size="22" text-anchor="middle" fill="#8ab4f0">-</text>
<text class="mono" x="958.0" y="175" font-size="22" text-anchor="middle" fill="#8ab4f0">.</text>
<text class="mono" x="1046.0" y="175" font-size="22" text-anchor="middle" fill="#8ab4f0">.</text>
<text class="mono" x="1090.0" y="175" font-size="22" text-anchor="middle" fill="#8ab4f0">:</text>
<text class="mono" x="782.0" y="209" font-size="22" text-anchor="middle" fill="#8ab4f0">*</text>
<text class="mono" x="826.0" y="209" font-size="22" text-anchor="middle" fill="#8ab4f0">%</text>
<text class="mono" x="870.0" y="209" font-size="22" text-anchor="middle" fill="#8ab4f0">+</text>
<text class="mono" x="914.0" y="209" font-size="22" text-anchor="middle" fill="#8ab4f0">:</text>
<rect x="936" y="184" width="44" height="34" fill="#f59e0b" opacity="0.28"/>
<text class="mono" x="1002.0" y="209" font-size="22" text-anchor="middle" fill="#8ab4f0">.</text>
<text class="mono" x="1046.0" y="209" font-size="22" text-anchor="middle" fill="#8ab4f0">-</text>
<text class="mono" x="1090.0" y="209" font-size="22" text-anchor="middle" fill="#8ab4f0">=</text>
<text class="cap" x="760" y="244">each cell is a copy of one tile, and all 1,536</text>
<text class="cap" x="760" y="260">copies are a single array operation</text>
<text class="dim" x="760" y="282">position 0 is the blank tile, which is why one of</text>
<text class="dim" x="760" y="297">the three followed below arrives empty</text>
<line x1="28" y1="322" x2="1152" y2="322" stroke="#e5e7eb"/>
<text class="step" x="40" y="350">three cells, followed through</text>
<rect class="idx" x="40" y="374" width="32" height="26" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.6"/>
<text class="mono" x="56" y="391" font-size="12" text-anchor="middle" fill="#334155">9</text>
<line x1="80" y1="387" x2="106" y2="387" stroke="#f59e0b" stroke-width="1.6" marker-end="url(#amber)"/>
<rect class="tile" x="114" y="366" width="34" height="42" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.8"/>
<text class="mono" x="131" y="396" font-size="19" text-anchor="middle" fill="#1e3a8a">@</text>
<line x1="156" y1="387" x2="182" y2="387" stroke="#f59e0b" stroke-width="1.6" marker-end="url(#amber)"/>
<rect x="190" y="370" width="44" height="34" fill="#0b0b0c" stroke="#334155"/>
<rect x="190" y="370" width="44" height="34" fill="#f59e0b" opacity="0.28"/>
<text class="mono" x="212" y="396" font-size="22" text-anchor="middle" fill="#8ab4f0">@</text>
<text class="cap" x="40" y="434">position 9 picks the @ tile,</text>
<text class="cap" x="40" y="450">which lands at row 1, column 1</text>
<rect class="idx" x="420" y="374" width="32" height="26" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.6"/>
<text class="mono" x="436" y="391" font-size="12" text-anchor="middle" fill="#334155">6</text>
<line x1="460" y1="387" x2="486" y2="387" stroke="#f59e0b" stroke-width="1.6" marker-end="url(#amber)"/>
<rect class="tile" x="494" y="366" width="34" height="42" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.8"/>
<text class="mono" x="511" y="396" font-size="19" text-anchor="middle" fill="#1e3a8a">*</text>
<line x1="536" y1="387" x2="562" y2="387" stroke="#f59e0b" stroke-width="1.6" marker-end="url(#amber)"/>
<rect x="570" y="370" width="44" height="34" fill="#0b0b0c" stroke="#334155"/>
<rect x="570" y="370" width="44" height="34" fill="#f59e0b" opacity="0.28"/>
<text class="mono" x="592" y="396" font-size="22" text-anchor="middle" fill="#8ab4f0">*</text>
<text class="cap" x="420" y="434">position 6 picks the * tile,</text>
<text class="cap" x="420" y="450">which lands at row 2, column 3</text>
<rect class="idx" x="800" y="374" width="32" height="26" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.6"/>
<text class="mono" x="816" y="391" font-size="12" text-anchor="middle" fill="#334155">0</text>
<line x1="840" y1="387" x2="866" y2="387" stroke="#f59e0b" stroke-width="1.6" marker-end="url(#amber)"/>
<rect class="tile" x="874" y="366" width="34" height="42" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.8"/>
<text class="dim" x="891" y="392" text-anchor="middle">blank</text>
<line x1="916" y1="387" x2="942" y2="387" stroke="#f59e0b" stroke-width="1.6" marker-end="url(#amber)"/>
<rect x="950" y="370" width="44" height="34" fill="#0b0b0c" stroke="#334155"/>
<rect x="950" y="370" width="44" height="34" fill="#f59e0b" opacity="0.28"/>
<text class="cap" x="800" y="434">position 0 picks the blank tile,</text>
<text class="cap" x="800" y="450">which lands at row 3, column 5</text>
<text class="dim" x="40" y="478">Nothing is drawn along the way: the tile is copied, pixels and all, into the place the position names. That is the whole</text>
<text class="dim" x="40" y="493">reason the panel asks this table for a number and has no use at all for the character standing at it.</text>
<text class="dim" x="40" y="514">How those tiles then become bytes for the panel is a separate scenario - see the related list below.</text>
</svg>
