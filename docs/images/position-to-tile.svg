<text class="mono" x="280.0" y="185" font-size="12" text-anchor="middle" fill="#334155">4</text>
<text class="cap" x="40" y="220">the same numbers the table above produces,</text>
<text class="cap" x="40" y="236">one per character cell</text>
<text class="dim" x="40" y="258">eight by three shown here; the panel's own grid</text>
<text class="dim" x="40" y="273">is 64 by 24, so 1,536 of them</text>
<text class="step" x="340" y="104">the glyph atlas: what a number selects</text>
<rect class="tile" x="340" y="116" width="34" height="42" rx="2" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.8"/>
<text class="dim" x="357" y="142" text-anchor="middle">blank</text>
<text class="mono" x="357" y="174" font-size="12" text-anchor="middle" fill="#6b7280">0</text>
<rect class="tile" x="378" y="116" width="34" height="42" rx="2"/>
<text class="mono" x="395" y="146" font-size="19" text-anchor="middle" fill="#1e3a8a">.</text>
<text class="mono" x="395" y="174" font-size="12" text-anchor="middle" fill="#6b7280">1</text>
<rect class="tile" x="416" y="116" width="34" height="42" rx="2"/>
<text class="mono" x="433" y="146" font-size="19" text-anchor="middle" fill="#1e3a8a">:</text>
<text class="mono" x="433" y="174" font-size="12" text-anchor="middle" fill="#6b7280">2</text>
<rect class="tile" x="454" y="116" width="34" height="42" rx="2"/>
